 if(!['before','after'].includes(mode)) throw Error('Bitte wähle einen Einstieg.');
 const person={id:crypto.randomUUID(),alias:alias.trim(),source,note,dates:date?[date]:[]};
 people.push(person);return person;
}
function stats(){return {people:people.length,dates:people.reduce((n,p)=>n+p.dates.length,0),dated:people.reduce((n,p)=>n+p.dates.filter(d=>d.day).length,0)}}
function removePerson(id){const i=people.findIndex(p=>p.id===id);if(i>=0)people.splice(i,1);updates.forEach(u=>u.personIds=u.personIds.filter(x=>x!==id))}

const updates=[];
function mentionedPeople(text){
 const norm=s=>s.normalize('NFC').toLocaleLowerCase('de');const content=norm(text);
 const names=p=>[p.alias,p.nickname].filter(Boolean).map(norm);
 return people.filter(p=>names(p).some(name=>{
  if(people.filter(q=>names(q).includes(name)).length!==1)return false;
  let pos=content.indexOf(name);
  while(pos!==-1){const before=Array.from(content.slice(0,pos)).at(-1)||'';const after=Array.from(content.slice(pos+name.length))[0]||'';
   if(!/[\p{L}\p{N}_]/u.test(before)&&!/[\p{L}\p{N}_]/u.test(after))return true;
   pos=content.indexOf(name,pos+1);
  }return false;
 }));
}
function saveUpdate(story,day,personIds){
 if(!story.trim())throw Error('Schreibe etwas für dein Tagesupdate.');
 const entry={id:crypto.randomUUID(),type:'update',story:story.trim(),day,personIds:[...new Set(personIds)].filter(id=>people.some(p=>p.id===id))};
 updates.push(entry);return entry;
}
function entriesForPerson(id){return [...(people.find(p=>p.id===id)?.dates||[]),...updates.filter(u=>u.personIds.includes(id))].sort(compareEntries)}
function compareEntries(a,b){return a.day&&b.day?b.day.localeCompare(a.day):a.day?-1:b.day?1:0}

function chips(label,values,current,key,multi=false){return `<fieldset><legend>${label}</legend><div class="chips">${values.map(v=>`<button type="button" data-key="${key}" data-value="${esc(v)}" aria-pressed="${multi?current.includes(v):current===v}">${esc(v)}</button>`).join('')}</div></fieldset>`}
function wire(state){app.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key,v=b.dataset.value;if(Array.isArray(state[k]))state[k]=state[k].includes(v)?state[k].filter(x=>x!==v):[...state[k],v];else state[k]=state[k]===v?'':v;app.querySelectorAll(`[data-key="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',Array.isArray(state[k])?state[k].includes(x.dataset.value):state[k]===x.dataset.value))})}

function choosePerson(){const activePeople=people.filter(p=>!p.archived);show(`<button class="back" id="back">← Start</button><span class="eyebrow">Neues Date oder Erlebnis</span><h1>Mit wem?</h1><p>Wähle zuerst eine bestehende Person aus.</p>${activePeople.length?`<button class="secondary" id="add-person">＋ Neue Person anlegen</button><div class="person-grid">${activePeople.map(p=>`<button class="card person-tile" data-person="${p.id}">${personAvatar(p)}<strong>${esc(p.nickname||p.alias)}</strong><small>${esc(p.source||'Deine Bekanntschaft')}</small></button>`).join('')}</div>`:'<div class="card"><h2>Noch keine Person vorhanden.</h2><p>Lege zuerst eine Person an. Danach kannst du ihr Dates und Erlebnisse zuordnen.</p><button class="primary" id="first">Neue Person hinzufügen</button></div>'}`);bind('back',home);if(app.querySelector('#add-person'))bind('add-person',add);if(!activePeople.length)bind('first',add);app.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>dateForm(people.find(p=>p.id===b.dataset.person),choosePerson))}
function add(){const d={alias:'',mode:'',source:'',sourceOther:'',note:'',mood:'',green:[],red:[],interest:'',rating:'',day:'',story:''};let step=0;
function render(){show(`<button class="back" id="back">← ${step?'Zurück':'alle Dates'}</button><div class="steps">${[0,1,2].map(n=>`<span class="${n<=step?'on':''}"></span>`).join('')}</div><span class="eyebrow">${step+1} von 3 · ${['Die Begegnung','Dein Gefühl','Deine Erinnerung'][step]}</span><h1>${['Neue Person','Einschätzung','Notizen'][step]}</h1>${step===2?'<p></p>':''}<form id="form">${step===0?`<div class="choices"><button type="button" data-mode="before" aria-pressed="${d.mode==='before'}">Noch kein Date<small>Erst mal kennenlernen</small></button><button type="button" data-mode="after" aria-pressed="${d.mode==='after'}">Schon gedatet<small>Ein Erlebnis festhalten</small></button></div><label for="alias">Name oder Spitzname</label><input id="alias" required maxlength="100" value="${esc(d.alias)}" placeholder="z. B. Hairybert oder Ameisen-Dude">${chips('Wo habt ihr euch kennengelernt?',['Tinder','Bumble','Hinge','Freunde','Alltag','Sonstiges'],d.source,'source')}<div id="other-source" ${d.source==='Sonstiges'?'':'hidden'}><label for="source-other">Wo genau? · optional</label><input id="source-other" value="${esc(d.sourceOther)}" placeholder="Zum Beispiel: im Fallschirmsprungkurs"></div>`:step===1?`${chips(d.mode==='before'?'Dein Bauchgefühl':'Wie ging es dir nach dem Date?',d.mode==='before'?['Noch keins','Neugierig','Misstrauisch','Gemischt']:moods,d.mood,'mood')}${chips(d.mode==='before'?'Möchtest du die Person treffen?':'Lust auf ein Wiedersehen?',['Ja','Vielleicht','Nein','Noch offen'],d.interest,'interest')}<details><summary>Beobachtungen & Flags ergänzen</summary>${chips('Green Flags <span class=green-flag>⚑</span>',green,d.green,'green',true)}${chips('Red Flags <span class=red-flag>⚑</span>',red,d.red,'red',true)}${freeFlags(d)}</details>${d.mode==='after'?ratingInput(d):''}`:`${d.mode==='after'?`<label for="day">Datum des Dates · optional</label><input type="date" id="day" value="${esc(d.day)}">`:''}${d.mode==='after'?eventFields():''}<label for="story">${d.mode==='before'?'Dein erster Eindruck':'Notizen'} · optional</label><textarea id="story" placeholder="Notizen">${esc(d.story)}</textarea><div class="card"><span class="eyebrow"></span><h2>${esc(d.alias)}</h2><p>${esc(d.source==='Sonstiges'&&d.sourceOther?'Sonstiges: '+d.sourceOther:d.source||'Kennenlernort offen')} · ${d.mode==='before'?'Noch kein Date':'Schon gedatet'}</p><small>${esc(d.mood||'Gefühl bleibt offen')}</small></div>`}<p id="error" role="alert"></p><button class="primary">${step===2?'Person speichern':'Weiter →'}</button></form>`);wire(d);wireExtras(d);if(step===0)app.querySelectorAll('[data-key=source]').forEach(b=>b.addEventListener('click',()=>{app.querySelector('#other-source').hidden=d.source!=='Sonstiges'}));app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{d.mode=b.dataset.mode;app.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b))});function capture(){if(step===0){d.alias=app.querySelector('#alias').value;d.sourceOther=app.querySelector('#source-other').value.trim();}if(step===2){d.story=app.querySelector('#story').value;d.day=app.querySelector('#day')?.value||''}}
bind('back',()=>{capture();if(step){step--;render()}else list()});app.querySelector('form').onsubmit=e=>{e.preventDefault();capture();if(step===0&&(!d.mode||!d.alias.trim())){app.querySelector('#error').textContent='Wähle einen Einstieg und gib einen Spitznamen ein.';return}if(step<2){step++;render();return}const date=d.mode==='after'&&(d.day||d.story||d.mood||d.rating||['kiss','sex','awkward'].some(k=>app.querySelector('#'+k)?.value==='yes'))?{day:d.day,story:d.story,mood:d.mood,rating:d.rating,ratingScale:10,green:allFlags(d,'green'),red:allFlags(d,'red'),...readEvents()}:null;const p=createPerson(d.alias,d.mode,d.source==='Sonstiges'&&d.sourceOther?'Sonstiges: '+d.sourceOther:d.source,d.mode==='before'?d.story:'',date);Object.assign(p,{mood:d.mood,interest:d.interest,green:allFlags(d,'green'),red:allFlags(d,'red'),mode:d.mode});editPerson(p, true)}}render()}
function list(){active('people');const visible=people.filter(p=>!!p.archived===archiveView);const entries=[...visible.flatMap(p=>p.dates.map(d=>({p,d}))),...updates.filter(d=>!archiveView||d.personIds.some(id=>visible.some(p=>p.id===id))).map(d=>({p:null,d}))].sort((a,b)=>compareEntries(a.d,b.d));show(`<span class="eyebrow"></span><h1>${archiveView?'abgeschlossen':'alle Dates'}</h1><div class="chips" role="group" aria-label="Ansicht"><button id="timeline" aria-pressed="${collectionMode==='timeline'}">Chronologisch</button><button id="tiles" aria-pressed="${collectionMode==='people'}">Nach Personen</button></div><button class="archive-link" id="archive-toggle">${archiveView?'← Aktuelle Bekanntschaften':'abgeschlossen'}</button>${collectionMode==='timeline'?`<p class="footnote">Neueste zuerst · Einträge ohne Datum stehen am Ende.</p>${entries.map(({p,d})=>d.type==='update'?updateCard(d):`<article class="card"><span class="eyebrow">${esc(d.day||'Ohne Datum')} · ${d.type==='experience'?'Erlebnis':'Date'}</span><h2>${esc(p.nickname||p.alias)}</h2><p>${esc(d.mood||'Gefühl offen')}</p><p class="story">${esc(d.story)}</p>${gallery(d.media)}<button data-person="${p.id}">Zur Person →</button></article>`).join('')||'<div class="card"><h2>Keine Einträge</h2><p>Noch keine Dates oder Erlebnisse festgehalten.</p></div>'}`:`<button class="secondary" id="add-person">＋ Neue Person anlegen</button><div class="person-grid">${visible.map(p=>`<button class="card person-tile" data-person="${p.id}">${personAvatar(p)}<strong>${esc(p.nickname||p.alias)}</strong><small>${entriesForPerson(p.id).length} Einträge · ${esc(p.source||'Quelle offen')}</small></button>`).join('')||'<p>Noch keine Personen angelegt.</p>'}</div>`}<button class="primary" id="new-event">＋ Neues Date oder Erlebnis hinzufügen</button><button class="secondary" id="daily-update" style="width:100%;margin-top:12px">✎ Tagesupdate schreiben</button>`);if(app.querySelector('#add-person'))bind('add-person',add);bind('archive-toggle',()=>{archiveView=!archiveView;list()});bind('daily-update',updateForm);bind('timeline',()=>{collectionMode='timeline';list()});bind('tiles',()=>{collectionMode='people';list()});bind('new-event',choosePerson);app.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>detail(people.find(p=>p.id===b.dataset.person)))}
function detail(p){show(`<button class="back" id="back">← alle Dates</button><span class="eyebrow">${esc(p.source||'')}</span><h1>${esc(p.nickname||p.alias)}</h1>${p.nickname?`<p>${esc(p.alias)}</p>`:''}${gallery(p.media)}${p.reminder?`<div class="card"><h2>An dein zukünftiges Ich</h2><p class="story">${esc(p.reminder)}</p></div>`:''}<p>${esc(p.traits||'')}</p><button id="edit-profile">Profil bearbeiten · Bilder & Eigenschaften</button><p>${esc(p.mood||'Gefühl offen')} · ${esc(p.interest?'Wiedersehen / Treffen: '+p.interest:'')}</p><button class="primary" id="date">＋ Date oder Erlebnis hinzufügen</button><details><summary>Eindruck & Beobachtungen</summary><p class="story">${esc(p.note||'Noch keine Notizen.')}</p><p>Green Flags: ${esc((p.green||[]).join(' · ')||'Keine erfasst')}</p><p>Red Flags: ${esc((p.red||[]).join(' · ')||'Keine erfasst')}</p></details><h2>Verlauf</h2>${entriesForPerson(p.id).map(d=>d.type==='update'?updateCard(d):`<article class="card"><span class="eyebrow">${esc(d.day||'Datum offen')}</span><h2>${esc(d.mood||'Date')}</h2><p class="story">${esc(d.story)}</p>${gallery(d.media)}${d.rating?`<small>Erlebnis: ${esc(d.rating)} / ${d.ratingScale||5}</small>`:''}</article>`).join('')||'<p>Noch keine Einträge.</p>'}<details><summary>Person verwalten</summary><button id="archive-person">${p.archived?'Zurück zu aktuellen Bekanntschaften':'Ausblenden / Kapitel beenden'}</button><button id="delete">Person und zugehörige Dates löschen</button></details>`);bind('back',list);bind('edit-profile',()=>editPerson(p));bind('archive-person',()=>{if(p.archived){p.archived=false;detail(p)}else archivePerson(p)});bind('delete',()=>{if(confirm('Person und ihre Dates löschen? Geteilte Tagesupdates bleiben erhalten, verlieren aber diese Zuordnung. Ihr Text bleibt unverändert.')){removePerson(p.id);list()}});bind('date',()=>dateForm(p))}
function dateForm(p,back=()=>detail(p)){const d={type:'date',day:'',mood:'',rating:'',story:'',green:[],red:[],media:[]};show(`<button class="back" id="back">← Zur Geschichte</button><h1>Date oder Erlebnis</h1><p>${esc(p.nickname||p.alias)}</p><form><label for="kind">Was möchtest du festhalten?</label><select id="kind"><option value="date">Date</option><option value="experience">Erlebnis</option></select><label for="day">Datum · optional</label><input type="date" id="day">${chips('Wie ging es dir nach dem Date?',d.mode==='before'?['Noch keins','Neugierig','Misstrauisch','Gemischt']:moods,d.mood,'mood')}${ratingInput(d)}${flagFields(d)}${eventFields()}${mediaInput()}<label for="story">Notizen</label><textarea id="story"></textarea><p id="error" role="alert"></p><button class="primary">Eintrag speichern</button></form>`);wire(d);wireExtras(d);attachMedia(d);bind('back',back);app.querySelector('form').onsubmit=e=>{e.preventDefault();d.type=app.querySelector('#kind').value;d.day=app.querySelector('#day').value;d.story=app.querySelector('#story').value.trim();Object.assign(d,readEvents(),{ratingScale:10,green:allFlags(d,'green'),red:allFlags(d,'red')});if(!d.day&&!d.story&&!d.mood&&!d.rating&&!d.media.length&&!['kiss','sex','awkward'].some(k=>d[k]==='yes')){app.querySelector('#error').textContent='Halte mindestens ein Datum, Gefühl, Erlebnisrating oder eine Geschichte fest.';return}p.dates.push(d);detail(p)}}

function updateForm(){const now=new Date();const day=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');const overrides=new Map();let selected=[];const draft={media:[]};
 show(`<button class="back" id="back">← Start</button><span class="eyebrow">Tagesupdate</span><h1>Dein Tagesupdate</h1><p>Was ist heute passiert? Erwähne gespeicherte Namen oder wähle die Personen selbst aus.</p><form><label for="update-day">Datum</label><input id="update-day" type="date" value="${day}"><label for="update-story">Dein Update</label><textarea id="update-story" required placeholder="Heute habe ich Max getroffen. Später hat sich …"></textarea>${mediaInput()}<fieldset><legend>Personen zuordnen</legend><p class="footnote">Eindeutig erkannte Namen werden vorausgewählt. Prüfe die Zuordnung; du kannst sie jederzeit ändern. Bei gleichen Namen bitte selbst auswählen.</p><div id="links"></div><p id="link-status" role="status"></p></fieldset><p id="error" role="alert"></p><button class="primary">Tagesupdate speichern</button></form>`);
 attachMedia(draft);const refresh=()=>{const found=mentionedPeople(app.querySelector('#update-story').value).map(p=>p.id);selected=people.filter(p=>overrides.has(p.id)?overrides.get(p.id):found.includes(p.id)).map(p=>p.id);app.querySelector('#links').innerHTML=people.map(p=>`<label style="display:flex;align-items:center;gap:12px;font-weight:400"><input style="width:20px;height:20px" type="checkbox" data-link="${p.id}" ${selected.includes(p.id)?'checked':''}>${esc(p.nickname? p.alias+' / '+p.nickname:p.alias)} · ${esc(p.source||'Quelle offen')}${found.includes(p.id)?' (im Text erkannt)':''}</label>`).join('')||'<p>Noch keine Personen gespeichert. Du kannst dein Update trotzdem festhalten.</p>';app.querySelector('#link-status').textContent=selected.length?`Erscheint in ${selected.length} Personenverläufen und einmal unter alle Dates.`:'Wird ohne Personenzuordnung gespeichert.';app.querySelectorAll('[data-link]').forEach(c=>c.onchange=()=>{overrides.set(c.dataset.link,c.checked);selected=people.filter(p=>overrides.has(p.id)?overrides.get(p.id):found.includes(p.id)).map(p=>p.id);app.querySelector('#link-status').textContent=selected.length?`Erscheint in ${selected.length} Personenverläufen und einmal unter alle Dates.`:'Wird ohne Personenzuordnung gespeichert.'})};refresh();app.querySelector('#update-story').oninput=refresh;bind('back',home);app.querySelector('form').onsubmit=e=>{e.preventDefault();try{const u=saveUpdate(app.querySelector('#update-story').value,app.querySelector('#update-day').value,selected);u.media=draft.media;collectionMode='timeline';list()}catch(err){app.querySelector('#error').textContent=err.message}};
}

function mediaInput(){return `<details><summary>Bilder & Datingprofil-Screenshots hinzufügen</summary><p class="footnote">Mehrere Bilder möglich. Datingapp-Profile als Screenshots; keine automatische Texterkennung oder Verbindung zur Datingapp. Bilder werden zusammen mit deinem Tagebuch lokal gespeichert.</p><label for="media-kind">Bildart</label><select id="media-kind"><option>Erinnerung / Foto</option><option>Datingprofil-Screenshot</option></select><label for="media-files">Bilder auswählen (JPEG, PNG, WebP)</label><input id="media-files" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="media-preview"></div><p id="media-error" role="status"></p></details>`}
function attachMedia(draft){draft.media??=[];const render=()=>{app.querySelector('#media-preview').innerHTML=gallery(draft.media)+draft.media.map((m,i)=>`<button type="button" data-remove-media="${i}">${esc(m.name)} entfernen</button>`).join('');app.querySelectorAll('[data-remove-media]').forEach(b=>b.onclick=()=>{draft.media.splice(+b.dataset.removeMedia,1);render()})};render();app.querySelector('#media-files').onchange=async e=>{const errors=[];for(const f of e.target.files){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>8*1024*1024||draft.media.length>=12){errors.push('Bitte maximal 12 JPEG/PNG/WebP-Bilder mit je höchstens 8 MB wählen.');continue}const url=URL.createObjectURL(f);const img=new Image();img.src=url;try{await img.decode();if(img.width*img.height>40000000)throw Error();const stored=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)});draft.media.push({url:stored,name:f.name,kind:app.querySelector('#media-kind').value});URL.revokeObjectURL(url)}catch{URL.revokeObjectURL(url);errors.push('Ein Bild konnte nicht gelesen werden.')}}render();app.querySelector('#media-error').textContent=errors.join(' ');e.target.value=''}}
function editPerson(p,isNew=false){const draft={media:[...(p.media||[])]};show(`<button class="back" id="back">← Profil</button><h1>${isNew?'Dein Profil ergänzen':'Profil bearbeiten'}</h1><form><label for="person-name">Name</label><input id="person-name" required value="${esc(p.alias)}"><label for="nickname">Spitzname · optional</label><input id="nickname" value="${esc(p.nickname||'')}" placeholder="z. B. Hairybert oder Ameisen-Dude"><label for="age">Alter beim Kennenlernen · optional</label><input id="age" type="number" min="18" max="120" value="${p.age||''}"><label for="met">Kennengelernt am · optional</label><input id="met" type="date" value="${p.metDay||''}"><label for="traits">Eigenschaften · in deinen Worten</label><textarea id="traits" placeholder="z. B. humorvoll, abenteuerlustig, ruhig …">${esc(p.traits||'')}</textarea>${mediaInput()}<p id="error" role="alert"></p><button class="primary">Profil speichern</button></form>`);attachMedia(draft);bind('back',()=>detail(p));app.querySelector('form').onsubmit=e=>{e.preventDefault();const name=app.querySelector('#person-name').value.trim();if(!name){app.querySelector('#error').textContent='Bitte gib einen Namen ein.';return}Object.assign(p,{alias:name,nickname:app.querySelector('#nickname').value.trim(),age:Number(app.querySelector('#age').value)||null,metDay:app.querySelector('#met').value,traits:app.querySelector('#traits').value,media:draft.media});detail(p)}}

function periodStart(period,now=new Date()){if(period==='all')return '';const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(period.endsWith('w'))d.setDate(d.getDate()-Number(period.slice(0,-1))*7);else{const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()-Number(period.slice(0,-1)));const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last))}return localDay(d)}
function distribution(values){return values.reduce((o,v)=>{if(v)o[v]=(o[v]||0)+1;return o},{})}
function donut(title,values,missing){const rows=Object.entries(distribution(values));const n=rows.reduce((s,[,v])=>s+v,0);const palettes={berry:['#873653','#b46a86','#d3a3b7','#657d70'],sky:['#326d96','#6a9fbd','#a5cada','#637e9b'],forest:['#365d49','#7b8d57','#aec498','#476d60'],sun:['#876414','#b28e2c','#e3bf58','#a98457'],lavender:['#74528e','#a086bd','#c5b4d6','#776c98']};const colors=palettes[preferences.theme]||palettes.berry;let offset=0;const gradient=rows.map(([,v],i)=>{const start=offset;offset+=v/n*100;return `${colors[i%colors.length]} ${start}% ${offset}%`}).join(',');return `<div class="card"><h2>${title}</h2>${n?`<div class="donut" style="background:conic-gradient(${gradient})" role="img" aria-label="${esc(title)}: ${esc(rows.map(([k,v])=>k+' '+v).join(', '))}"><span>${n}<small>Angaben</small></span></div>`:'<p>Noch keine Angaben.</p>'}<ul class="chart-key">${rows.map(([k,v],i)=>`<li><span style="background:${colors[i%colors.length]}"></span>${esc(k)} <b>${v} · ${Math.round(v/n*100)} %</b></li>`).join('')}</ul><small>${missing} ohne Angabe</small></div>`}
function insights(){active('insights');const all=people.flatMap(p=>p.dates.map(d=>({...d,person:p})));const lower=periodStart(wrappedPeriod);const inRange=d=>!lower||d&&d>=lower&&d<=todayKey();const events=all.filter(d=>inRange(d.day));const dates=events.filter(d=>d.type!=='experience');const met=people.filter(p=>inRange(p.metDay));const kpi=(title,n,info)=>`<div class="card"><span class="number">${n}</span>${title}<p class="footnote">${info}</p></div>`;show(`<span class="eyebrow">Dein Datingleben in Zahlen</span><h1>wrapped</h1><label for="period">Zeitraum</label><select id="period">${[['all','Seit immer'],['12m','Letzte 12 Monate'],['9m','Letzte 9 Monate'],['6m','Letzte 6 Monate'],['3m','Letzte 3 Monate'],['1w','Letzte Woche'],['2w','Letzte 2 Wochen'],['3w','Letzte 3 Wochen'],['4w','Letzte 4 Wochen']].map(([v,l])=>`<option value="${v}" ${wrappedPeriod===v?'selected':''}>${l}</option>`).join('')}</select><p class="footnote">${lower?'Ab '+lower+' bis heute, einschließlich. Undatierte Einträge ausgeschlossen.':'Alle gespeicherten Einträge, auch ohne Datum.'} Archivierte Bekanntschaften zählen mit.</p><div class="stats">${kpi('Dates',dates.length,'Dokumentierte Date-Einträge')}${kpi('Bekanntschaften',met.length,'Nach Kennenlerndatum')}${kpi('Personen, die du geküsst hast',new Set(events.filter(d=>d.kiss==='yes').map(d=>d.person.id)).size,'Jede Person zählt im Zeitraum einmal. '+events.filter(d=>!d.kiss).length+' Einträge ohne Angabe')}${kpi('Unangenehme Momente',events.filter(d=>d.awkward==='yes').length,events.filter(d=>!d.awkward).length+' Einträge ohne Angabe')}${showSex?kpi('Sex',events.filter(d=>d.sex==='yes').length,events.filter(d=>!d.sex).length+' Einträge ohne Angabe'):''}</div><label class="check-label"><input id="show-sex" type="checkbox" ${showSex?'checked':''}> Sex-Kennzahl anzeigen</label><p class="footnote">Geküsste Personen werden einmal pro Zeitraum gezählt. Sex und unangenehme Momente zählen bestätigte Date-/Erlebniseinträge, keine einzelnen Handlungen. Tagesupdates werden nicht automatisch ausgewertet.</p><div class="charts-grid">${donut('So ging es mir nach den Dates',dates.map(d=>d.mood),dates.filter(d=>!d.mood).length)}${donut('Wo kennengelernt?',met.map(p=>p.source),met.filter(p=>!p.source).length)}${donut('Wie alt waren meine Dates?',dates.map(d=>d.age?String(d.age)+' Jahre':'').filter(Boolean),dates.filter(d=>!d.age).length)}</div><p class="footnote">Alter basiert auf der Angabe am jeweiligen Date, nicht auf dem heutigen Alter. ${all.filter(d=>!d.day).length} Einträge und ${people.filter(p=>!p.metDay).length} Bekanntschaften haben kein Datum. Angaben lassen sich im Profil bzw. beim neuen Erlebnis ergänzen.</p>`);app.querySelector('#period').onchange=e=>{wrappedPeriod=e.target.value;insights()};app.querySelector('#show-sex').onchange=e=>{showSex=e.target.checked;insights()}}

const followers=[],following=[];
function circle(){show(`<button class="back" id="back">← Start</button><span class="eyebrow"></span><h1>Mein Kreis</h1><div class="notice">Funktionsdemo: keine echten Accounts, keine Nachrichten und keine Übertragung. Alle Anfragen und Freigaben werden nur hier simuliert; keine echten Accounts.</div><p>Eine angenommene Anfrage gibt noch keinen Tagebucheintrag frei. Du wählst für jede Person einzelne Lesefassungen aus.</p><details><summary>Selbst jemandem folgen · Demo</summary><form id="follow-form"><label for="follow-name">Profilname</label><input id="follow-name" required maxlength="80"><button>Anfrage simulieren</button></form>${following.map(f=>`<p>${esc(f.name)} · Anfrage ausstehend. Zugriff erst nach Freigabe durch diese Person.</p>`).join('')}</details><h2>Wer darf dir folgen?</h2><form id="request-form"><label for="request-name">Eingehende Anfrage testen · fiktiver Profilname</label><input id="request-name" required maxlength="80" placeholder="z. B. Lea"><button>Folgeanfrage simulieren</button></form>${followers.map(f=>`<article class="card"><h2>${esc(f.name)}</h2><p>${f.status==='pending'?'Anfrage ausstehend':f.status==='accepted'?`${f.shares.length} Lesefassungen freigegeben`:'Zugriff widerrufen'}</p>${f.status==='pending'?`<button data-accept="${f.id}">Annehmen</button><button data-revoke="${f.id}">Ablehnen</button>`:f.status==='accepted'?`<button data-manage="${f.id}">Lesefreigaben auswählen</button><button data-preview="${f.id}">Ansicht dieser Person</button><button data-revoke="${f.id}">Zugriff widerrufen</button>`:''}</article>`).join('')}`);bind('back',home);app.querySelector('#follow-form').onsubmit=e=>{e.preventDefault();const name=app.querySelector('#follow-name').value.trim();if(name){following.push({name});circle()}};app.querySelector('#request-form').onsubmit=e=>{e.preventDefault();const name=app.querySelector('#request-name').value.trim();if(name){followers.push({id:crypto.randomUUID(),name,status:'pending',shares:[]});circle()}};app.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{followers.find(f=>f.id===b.dataset.accept).status='accepted';circle()});app.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>{const f=followers.find(f=>f.id===b.dataset.revoke);f.status='revoked';f.shares=[];circle()});app.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>manageShares(followers.find(f=>f.id===b.dataset.manage)));app.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>previewShares(followers.find(f=>f.id===b.dataset.preview)))}
function shareSources(){return [...people.flatMap(p=>p.dates.map((d,i)=>({key:p.id+':'+i,label:(p.nickname||p.alias)+' · '+(d.day||'Datum offen'),original:d.story||d.mood||'Ein Erlebnis'}))),...updates.map(d=>({key:'update:'+d.id,label:'Tagesupdate · '+(d.day||'Datum offen'),original:d.story}))]}
function manageShares(f){if(f.status!=='accepted')return circle();const sources=shareSources();show(`<button class="back" id="back">← Mein Kreis</button><h1>Freigaben für ${esc(f.name)}</h1><p>Nur angekreuzte Einträge mit eigener Lesefassung werden freigegeben. Zukünftige Einträge bleiben privat.</p><div class="notice">Schreibe eine gesonderte Fassung ohne identifizierende oder intime Angaben über andere Personen. Auch Spitznamen und Kombinationen aus Ort und Datum können erkennbar sein. Die App prüft keine rechtliche Zulässigkeit.</div><form id="shares-form">${sources.map((s,i)=>{const saved=f.shares.find(x=>x.key===s.key);return `<div class="card"><label class="check-label"><input type="checkbox" data-share="${i}" ${saved?'checked':''}>${esc(s.label)}</label><details><summary>Original ansehen · nur für dich</summary><p class="story">${esc(s.original)}</p></details><label for="share-text-${i}">Lesefassung für ${esc(f.name)}</label><textarea id="share-text-${i}" placeholder="Nur diesen Text sieht die folgende Person.">${esc(saved?.text||'')}</textarea></div>`}).join('')||'<p>Noch keine Dates oder Tagesupdates vorhanden.</p>'}<p class="footnote">Keine Bilder, Profilnamen, Profilfelder, Sex-Kennzahlen oder Erinnerungen werden automatisch mitgeteilt. Empfänger können Inhalte kopieren oder fotografieren. Widerruf kann solche Kopien nicht zurückholen.</p><p id="share-error" role="alert"></p><button class="primary">Auswahl speichern & Vorschau</button></form>`);bind('back',circle);app.querySelector('form').onsubmit=e=>{e.preventDefault();const shares=[];for(const c of app.querySelectorAll('[data-share]:checked')){const i=+c.dataset.share,text=app.querySelector('#share-text-'+i).value.trim();if(!text){app.querySelector('#share-error').textContent='Bitte schreibe für jeden ausgewählten Eintrag eine Lesefassung.';return}shares.push({key:sources[i].key,text})}f.shares=shares;previewShares(f)}}
function previewShares(f){const valid=new Set(shareSources().map(s=>s.key));const shares=f.status==='accepted'?f.shares.filter(s=>valid.has(s.key)):[];show(`<button class="back" id="back">← Mein Kreis</button><span class="eyebrow">Simulierte Empfängeransicht</span><h1>Das sieht ${esc(f.name)}.</h1>${shares.map(s=>`<article class="card"><h2>Geteilter Moment</h2><p class="story">${esc(s.text)}</p></article>`).join('')||'<p>Keine Inhalte freigegeben.</p>'}<p class="footnote">Nur eine lokale Vorschau – keine tatsächliche Zugriffsabsicherung.</p>`);bind('back',circle)}

const b64=b=>btoa(Array.from(new Uint8Array(b),v=>String.fromCharCode(v)).join(''));

function database(){return new Promise((resolve,reject)=>{const r=indexedDB.open('todate-private-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('vault');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function readVault(){const db=await database();return new Promise((resolve,reject)=>{const tx=db.transaction('vault');const r=tx.objectStore('vault').get('main');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close()})}
async function writeVault(record){const db=await database();return new Promise((resolve,reject)=>{const tx=db.transaction('vault','readwrite'),store=tx.objectStore('vault');let conflict=false;const r=store.get('main');r.onsuccess=()=>{if((r.result?.revision||0)!==vaultRevision){conflict=true;tx.abort();return}store.put(record,'main')};tx.oncomplete=()=>{db.close();resolve()};tx.onabort=()=>{db.close();reject(Error(conflict?'Ein anderer Tab hat gespeichert. Diesen Tab nicht überschreiben; zuerst deine Änderungen sichern.':'Browser-Speicher nicht verfügbar oder voll.'))};tx.onerror=()=>{}})}
async function derive(password,salt){const material=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

function restoreData(s){if(s.version!==1||!Array.isArray(s.people)||!Array.isArray(s.updates))throw Error('Unbekanntes Datenformat.');people.splice(0,people.length,...s.people);updates.splice(0,updates.length,...s.updates);Object.keys(dailyMoods).forEach(k=>delete dailyMoods[k]);Object.assign(dailyMoods,s.dailyMoods||{});followers.splice(0,followers.length,...(s.followers||[]));following.splice(0,following.length,...(s.following||[]));preferences.theme=themeNames.includes(s.preferences?.theme)?s.preferences.theme:'berry';applyTheme()}
function statusText(s){document.querySelector('#save-status').textContent=s}
function saveNow(){clearTimeout(vaultTimer);vaultQueue=vaultQueue.catch(()=>{}).then(async()=>{if(!vaultKey)return;const json=JSON.stringify(stateData());if(json===vaultLast)return;statusText('Wird verschlüsselt gespeichert …');const iv=crypto.getRandomValues(new Uint8Array(12));const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},vaultKey,enc.encode(json));const record={format:'todate-v1',revision:vaultRevision+1,salt:b64(vaultSalt),iv:b64(iv),data:b64(ciphertext)};await writeVault(record);vaultRevision=record.revision;vaultLast=json;statusText('Auf diesem Gerät gespeichert');});return vaultQueue.catch(e=>{statusText('Nicht gespeichert: '+e.message);throw e})}
function scheduleSave(){if(!vaultKey)return;clearTimeout(vaultTimer);vaultTimer=setTimeout(()=>saveNow().catch(()=>{}),150)}
function toolbar(){vaultUI.innerHTML='<span id="save-status" role="status">Auf diesem Gerät gespeichert</span><div><button id="settings">Einstellungen</button><button id="save-now">Speichern</button><button id="backup">Backup</button><button id="lock">Sperren</button></div>';document.querySelector('#settings').onclick=settings;document.querySelector('#save-now').onclick=()=>saveNow().then(()=>statusText('Auf diesem Gerät gespeichert')).catch(()=>{});document.querySelector('#lock').onclick=async()=>{try{await saveNow();vaultKey=null;people.length=0;updates.length=0;followers.length=0;following.length=0;Object.keys(dailyMoods).forEach(k=>delete dailyMoods[k]);await vaultGate()}catch{}};document.querySelector('#backup').onclick=async()=>{try{await saveNow();const record=await readVault();const url=URL.createObjectURL(new Blob([JSON.stringify(record)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='Todate-Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch{}}}
async function vaultGate(){document.querySelector('nav').hidden=true;vaultUI.hidden=true;try{if(!crypto.subtle)throw Error('Bitte Todate über HTTPS oder localhost öffnen.');const record=await readVault();show(`<span class="eyebrow"></span><h1>${record?'Todate entsperren':'Todate einrichten'}</h1><p>${record?'Entsperre deine lokal gespeicherten Einträge.':'Wähle ein Passwort mit mindestens 12 Zeichen. Deine gespeicherten Texte und Bilder werden damit auf diesem Gerät verschlüsselt.'}</p><form id="unlock-form"><label for="vault-password">${record?'Passwort':'Neues Passwort'}</label><input id="vault-password" type="password" minlength="${record?1:12}" required autocomplete="${record?'current-password':'new-password'}">${record?'':'<label for="vault-repeat">Passwort wiederholen</label><input id="vault-repeat" type="password" required autocomplete="new-password">'}<p id="vault-error" role="alert"></p><button class="primary" id="unlock">${record?'Entsperren':'Lokalen Speicher einrichten'}</button></form><p class="footnote">Ohne Passwort gibt es keine Wiederherstellung. Browserdaten können gelöscht werden: sichere regelmäßig ein verschlüsseltes Backup. Speicherung gilt nur für diesen Browser und diese Webadresse. Kein Cloud-Abgleich. Web-Prototyp ohne unabhängigen Sicherheitsaudit.</p><details><summary>Verschlüsseltes Todate-Backup wiederherstellen</summary><label for="restore-file">Backup-Datei</label><input id="restore-file" type="file" accept="application/json"><label for="restore-password">Passwort des Backups</label><input id="restore-password" type="password"><button id="restore">Backup wiederherstellen</button><p id="restore-error" role="alert"></p></details>`);
app.querySelector('#unlock-form').onsubmit=async e=>{e.preventDefault();const password=app.querySelector('#vault-password').value;if(!record&&password!==app.querySelector('#vault-repeat').value){app.querySelector('#vault-error').textContent='Die Passwörter stimmen nicht überein.';return}app.querySelector('#unlock').disabled=true;try{const salt=record?un64(record.salt):crypto.getRandomValues(new Uint8Array(16));const key=await derive(password,salt);if(record){const json=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(record.iv)},key,un64(record.data));restoreData(JSON.parse(dec.decode(json)))}vaultKey=key;vaultSalt=salt;vaultRevision=record?.revision||0;vaultLast=record?JSON.stringify(stateData()):'';document.querySelector('nav').hidden=false;vaultUI.hidden=false;toolbar();if(!record)await saveNow();home()}catch{vaultKey=null;await vaultGate();app.querySelector('#vault-error').textContent='Entsperren oder Speichern fehlgeschlagen. Prüfe Passwort und Browser-Speicher.'}};
app.querySelector('#restore').onclick=async()=>{try{const file=app.querySelector('#restore-file').files[0];if(!file||file.size>200*1024*1024)throw Error('Bitte ein gültiges Backup bis 200 MB auswählen.');const r=JSON.parse(await file.text());if(r.format!=='todate-v1')throw Error('Unbekanntes Backupformat.');const key=await derive(app.querySelector('#restore-password').value,un64(r.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(r.iv)},key,un64(r.data));const s=JSON.parse(dec.decode(plain));if(s.version!==1||!Array.isArray(s.people)||!Array.isArray(s.updates))throw Error('Ungültiger Inhalt.');if(record&&!confirm('Vorhandene lokale Daten durch das Backup ersetzen?'))return;vaultRevision=record?.revision||0;await writeVault({...r,revision:vaultRevision+1});await vaultGate()}catch{app.querySelector('#restore-error').textContent='Wiederherstellung fehlgeschlagen. Prüfe Datei, Passwort und Speicher. Bestehende Daten wurden nicht ersetzt.'}};
}catch(e){show(`<h1>Speicher nicht verfügbar</h1><p>${esc(e.message)}</p><p>Bitte nutze Safari oder Chrome über eine HTTPS-Webadresse mit freigegebenem Browser-Speicher.</p>`)}}
document.addEventListener('click',()=>queueMicrotask(scheduleSave));document.addEventListener('change',()=>queueMicrotask(scheduleSave));document.addEventListener('submit',()=>queueMicrotask(scheduleSave));
window.addEventListener('beforeunload',e=>{if(vaultKey&&JSON.stringify(stateData())!==vaultLast){e.preventDefault();e.returnValue=''}});
await vaultGate();
document.querySelector('#splash')?.remove();
</script></html>
